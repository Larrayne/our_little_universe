<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Little Universe 💜</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <main class="welcome" id="welcomeScreen">

    <p class="small-text">✨ A little something for you ✨</p>

    <h1>Welcome to our little universe 💜</h1>

    <p class="instruction">
        I have a few questions for you...
    </p>

    <button class="heart-button" id="heartButton">
        ❤️
    </button>

    <p class="tap-text">Tap the heart 💕</p>

</main>


<section class="question-screen" id="questionScreen">

    <p class="question-number" id="questionNumber">
        Question 1 of 5
    </p>

    <h2 id="questionText">
        Do you love me? 💕
    </h2>

    <div class="answers">

        <button class="yes-button" id="yesButton">
            YES ❤️
        </button>

        <button class="no-button" id="noButton">
            NO 😈
        </button>

    </div>

</section>

    <div id="burstContainer"></div>

    <script src="script.js"></script>
</body>
</html>
